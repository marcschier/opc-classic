#
# Docker Compose definition for the opc-classic Windows-container test fleet.
#
# Brings up four Windows containers on a shared l2bridge network so they can
# exchange DCOM RPC traffic (port 135 + the pinned 49152-49200 dynamic range).
# NAT networking will NOT work because DCOM's OXID resolver announces the
# server's internal IP and the client cannot route back through NAT.
#
# Usage:
#   docker compose --file docker/docker-compose.test.yml build
#   docker compose --file docker/docker-compose.test.yml up -d c-server managed-server
#   docker compose --file docker/docker-compose.test.yml run --rm ctt `
#       -ProgId Opc.Classic.DaSample.1 -TargetHost opc-classic-managed
#   docker compose --file docker/docker-compose.test.yml down
#
# Prerequisites:
#   - Docker Desktop on Windows with `Switch to Windows containers`
#   - An l2bridge network created out-of-band (see docker/README.md):
#       docker network create --driver l2bridge `
#           --subnet 10.0.1.0/24 --gateway 10.0.1.1 opc-test-net

version: "3.8"

networks:
  opc-test-net:
    external: true
    name: opc-test-net

services:
  c-server:
    image: opc-classic/c-server
    container_name: opc-classic-c-server
    build:
      context: ..
      dockerfile: docker/opc-c-server/Dockerfile
    hostname: opc-classic-c-server
    networks:
      opc-test-net:
        ipv4_address: 10.0.1.10
    # NOTE: Phase-2 scaffold; container will idle until the C build is wired up.

  managed-server:
    image: opc-classic/managed
    container_name: opc-classic-managed
    build:
      context: ..
      dockerfile: docker/opc-managed/Dockerfile
    hostname: opc-classic-managed
    networks:
      opc-test-net:
        ipv4_address: 10.0.1.11

  ctt:
    image: opc-classic/ctt
    container_name: opc-classic-ctt
    build:
      context: ..
      dockerfile: docker/opc-ctt/Dockerfile
    networks:
      opc-test-net:
        ipv4_address: 10.0.1.20
    depends_on:
      - c-server
      - managed-server
    profiles:
      - interactive
    volumes:
      - ./results:C:/results

  c-client:
    image: opc-classic/c-client
    container_name: opc-classic-c-client
    build:
      context: ..
      dockerfile: docker/opc-c-client/Dockerfile
    networks:
      opc-test-net:
        ipv4_address: 10.0.1.21
    depends_on:
      - c-server
      - managed-server
    profiles:
      - interactive

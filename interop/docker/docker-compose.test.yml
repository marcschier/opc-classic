#
# Docker Compose definition for the opc-classic Windows-container test fleet.
#
# Brings up the Windows-container test fleet on a shared l2bridge network so they can
# exchange DCOM RPC traffic (port 135 + the pinned 49152-49200 dynamic range).
# NAT networking will NOT work because DCOM's OXID resolver announces the
# server's internal IP and the client cannot route back through NAT.
#
# Usage:
#   docker compose --file interop/docker/docker-compose.test.yml build
#   # OPERATOR: the testserver service requires external; use
#   # interop/docker/run-matrix.ps1 without -IncludeTestServer for the historical
#   # three-image path when that vendor tree is absent.
#   docker compose --file interop/docker/docker-compose.test.yml up -d c-server managed-server
#   docker compose --file interop/docker/docker-compose.test.yml down
#
# Prerequisites:
#   - Docker Desktop on Windows with `Switch to Windows containers`
#   - An l2bridge network created out-of-band (see interop/docker/README.md):
#       docker network create --driver l2bridge `
#           --subnet 10.0.1.0/24 --gateway 10.0.1.1 opc-test-net

version: "3.8"

networks:
  opc-test-net:
    external: true
    name: opc-test-net

services:
  c-server:
    image: opc-classic/c-server
    container_name: opc-classic-c-server
    build:
      context: ../..
      dockerfile: interop/docker/opc-c-server/Dockerfile
    hostname: opc-classic-c-server
    networks:
      opc-test-net:
        ipv4_address: 10.0.1.10
    # NOTE: Phase-2 scaffold; container will idle until the C build is wired up.

  managed-server:
    image: opc-classic/managed
    container_name: opc-classic-managed
    build:
      context: ../..
      dockerfile: interop/docker/opc-managed/Dockerfile
    hostname: opc-classic-managed
    networks:
      opc-test-net:
        ipv4_address: 10.0.1.11

  testserver:
    image: opc-classic/testserver
    container_name: opc-classic-testserver
    build:
      context: ../..
      dockerfile: interop/docker/opc-testserver/Dockerfile
    hostname: opc-classic-testserver
    networks:
      opc-test-net:
        ipv4_address: 10.0.1.12

  c-client:
    image: opc-classic/c-client
    container_name: opc-classic-c-client
    build:
      context: ../..
      dockerfile: interop/docker/opc-c-client/Dockerfile
    networks:
      opc-test-net:
        ipv4_address: 10.0.1.21
    depends_on:
      - c-server
      - managed-server
    profiles:
      - interactive

  testclient:
    image: opc-classic/testclient
    container_name: opc-classic-testclient
    build:
      context: ../..
      dockerfile: interop/docker/opc-testclient/Dockerfile
    networks:
      opc-test-net:
        ipv4_address: 10.0.1.22
    depends_on:
      - testserver
    profiles:
      - interactive

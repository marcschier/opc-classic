[global]
    workgroup = TESTDOMAIN
    server string = Opc.Classic Samba WINREG fixture
    server role = standalone server
    security = user
    passdb backend = tdbsam
    map to guest = never

    server min protocol = SMB2_02
    server max protocol = SMB3_11
    server signing = mandatory
    server smb encrypt = if_required
    ntlm auth = yes
    lanman auth = no

    dcerpc endpoint servers = epmapper, wkssvc, srvsvc, winreg
    rpc_server:winreg = embedded
    allow dcerpc auth level connect:winreg = yes
    registry shares = yes

    load printers = no
    disable spoolss = yes
    dns proxy = no
    log level = 1

[opc]
    path = /srv/samba/share
    read only = no
    browseable = yes
    valid users = opcuser

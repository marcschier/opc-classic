name: fuzz-deep

on:
  workflow_dispatch:
  schedule:
    # Weekly deep fuzz cadence: Sunday 06:00 UTC.
    - cron: '0 6 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-deep:
    name: Deep fuzz regression sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Opc.Classic.slnx

      - name: Build
        run: dotnet build Opc.Classic.slnx --configuration Release --no-restore

      - name: Run fuzz tests with deep iteration count
        # Runs all Fuzz-category parser harnesses at 10,000 iterations with a
        # per-run seed for corpus discovery variety while preserving replayability.
        env:
          OPCCLASSIC_FUZZ_ITERATIONS: "10000"
          OPCCLASSIC_FUZZ_SEED: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          projects=(
            "tests/Opc.Classic.PropertyTests"
            "tests/Opc.Classic.Dcom.Smb.Tests"
            "tests/Opc.Classic.Dcom.Kerberos.Tests"
            "tests/Opc.Classic.Dcom.Tests"
            "tests/Opc.Classic.Cpx.Tests"
            "tests/Opc.Classic.Discovery.Tests"
            "tests/Opc.Classic.Xml.Tests"
            "tests/Opc.Classic.Mcp.Capture.Tests"
          )

          for project in "${projects[@]}"; do
            name="$(basename "$project")"
            dotnet test "$project" \
              --configuration Release \
              --no-build \
              --logger "trx;LogFileName=fuzz-${name}.trx" \
              -- \
              --treenode-filter "/*/*/*/*[Category=Fuzz]"
          done

      - name: Upload fuzz test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-deep-trx
          path: tests/**/TestResults/*.trx
          if-no-files-found: warn

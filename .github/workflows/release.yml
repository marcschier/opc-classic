name: Release

on:
  push:
    tags:
      # Accept both v-prefixed (v1.0.0) and bare semver (1.0.0) tags.
      # The `v` prefix is the canonical convention going forward; bare tags
      # are tolerated for compatibility with the existing 1.0.0-rc.N history.
      - 'v*'
      - '1.*'
      - '2.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0-rc.11 or 1.0.0-rc.11). Required when triggering manually.'
        required: true
        type: string
      publish_reference_images:
        description: 'Also publish opc-c-server and opc-c-client images to GHCR (for downstream interop consumers). Default: opc-managed only.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write      # for creating the GitHub Release
  packages: write      # for publishing to GitHub Packages NuGet feed + GHCR Docker registry
  id-token: write      # for SourceLink reproducible-build attestation

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      is_stable: ${{ steps.tag.outputs.is_stable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate tag format
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Accept optional leading "v": v1.0.0, v1.0.0-rc.11, 1.0.0, 1.0.0-rc.11.
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$TAG' must match [v]<MAJOR>.<MINOR>.<PATCH>[-<prerelease>.<N>]"
            exit 1
          fi
          # Strip leading "v" so the package/image version stays canonical (1.0.0-rc.11, not v1.0.0-rc.11).
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # is_stable=true only for releases without a prerelease suffix (no `-`).
          if [[ "$VERSION" == *-* ]]; then
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          fi
          # Also export VERSION as env for downstream steps in this job.
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Opc.Classic.slnx

      - name: Build
        run: dotnet build Opc.Classic.slnx --no-restore -c Release -p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test Opc.Classic.slnx --no-build -c Release --filter "Category!=NativeConformance&Category!=MatrikonConformance&Category!=CompatMatrix"

      - name: Pack
        run: dotnet pack Opc.Classic.slnx --no-build -c Release -p:Version=${{ env.VERSION }} -o ./.nupkg

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::warning::NUGET_API_KEY not configured - skipping nuget.org push (artifacts uploaded for manual review)"
          else
            dotnet nuget push ./.nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          fi

      - name: Push to GitHub Packages NuGet feed
        # Always runs on tag push. GITHUB_TOKEN is auto-issued and the workflow
        # has `permissions: packages: write`, so no additional secret is needed.
        # Consumers will need a PAT with `read:packages` scope to install from
        # this feed (GitHub Packages NuGet requires authenticated reads even
        # for public packages). See docs/RELEASE_PROCESS.md.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push ./.nupkg/*.nupkg \
            --api-key "$GITHUB_TOKEN" \
            --source https://nuget.pkg.github.com/marcschier/index.json \
            --skip-duplicate

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: opcclassic-${{ env.VERSION }}-nupkgs
          path: ./.nupkg

      - name: Extract changelog notes
        id: changelog
        shell: bash
        run: |
          # Extract the section for this version from CHANGELOG.md (Keep a Changelog format).
          NOTES=$(awk -v ver="${{ env.VERSION }}" '
            $0 ~ "^## \\[" ver "\\]" { sec=1; next }
            /^## \[/{ if (sec) exit }
            sec { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::error::No CHANGELOG.md section found for ${{ env.VERSION }}"
            exit 1
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 'Opc.Classic ${{ env.VERSION }}'
          body: |
            ## What's new

            ${{ steps.changelog.outputs.notes }}

            ## Packages

            All `Opc.Classic.*` packages published at version `${{ env.VERSION }}` to:

            - **nuget.org** — `dotnet add package Opc.Classic.<Spec> --version ${{ env.VERSION }}` (when `NUGET_API_KEY` is configured).
            - **GitHub Packages NuGet feed** — `https://nuget.pkg.github.com/marcschier/index.json` (requires a PAT with `read:packages` scope to install; see `docs/RELEASE_PROCESS.md`).

            ## Container images

            Managed OPC DA server image published to **GHCR**:

            - `ghcr.io/marcschier/opc-classic-managed:${{ env.VERSION }}`
            - `ghcr.io/marcschier/opc-classic-managed:latest` *(stable releases only)*

            ## Status

            Pre-1.0 alpha. See [Phase 14D compat matrix](docs/COMPAT_MATRIX_STATUS.md) for release-readiness.
          files: ./.nupkg/*.nupkg
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-publish:
    # Build and push the distributable Windows Docker image(s) to GHCR.
    # Tagged-only: runs on tag push or workflow_dispatch (same trigger as the
    # `release` job). Gated on `release` succeeding so we never publish a
    # Docker image for a tag whose NuGet packages failed to build.
    #
    # By default only the `opc-managed` image (the Windows distributable
    # managed OPC DA server) is published. The C-built reference images
    # (`opc-c-server`, `opc-c-client`) can be opted-in via the
    # `publish_reference_images` workflow_dispatch input (off for tag-push to
    # avoid surprising the registry with test/interop infrastructure on every
    # release).
    #
    # The Linux variant of `opc-managed` is published by the cheaper
    # `docker-publish-linux` job below; both target the same registry path
    # but use distinct image names (`opc-classic-managed` for Windows,
    # `opc-classic-managed-linux` for Linux) so downstream consumers can pick
    # the right OS image without needing a multi-arch manifest list.
    needs: release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Compute Docker tag list
        id: tags
        shell: pwsh
        run: |
          $version = '${{ needs.release.outputs.version }}'
          $stable  = '${{ needs.release.outputs.is_stable }}' -eq 'true'

          function Compose-Tags([string] $image) {
              $tags = @("ghcr.io/marcschier/$image`:$version")
              if ($stable) { $tags += "ghcr.io/marcschier/$image`:latest" }
              return ($tags -join ',')
          }

          "managed_tags=$(Compose-Tags 'opc-classic-managed')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cserver_tags=$(Compose-Tags 'opc-classic-c-server')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cclient_tags=$(Compose-Tags 'opc-classic-c-client')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build and push opc-classic-managed
        id: build-managed
        uses: docker/build-push-action@v6
        with:
          context: .
          file: interop/docker/opc-managed/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.managed_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/marcschier/opc-classic
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=Opc.Classic managed OPC DA server
            org.opencontainers.image.description=Cross-platform .NET 10 managed OPC Classic DA server container.

      - name: Sign opc-classic-managed (cosign keyless)
        env:
          DIGEST: ${{ steps.build-managed.outputs.digest }}
        shell: pwsh
        run: |
          # Cosign keyless signing uses the workflow's OIDC token (we already
          # have `id-token: write` at the workflow level). The signature is
          # uploaded to the Sigstore Rekor transparency log and as a co-located
          # `.sig` artifact in GHCR. Verify with:
          #   cosign verify ghcr.io/marcschier/opc-classic-managed@${{ env.DIGEST }} \
          #     --certificate-identity-regexp 'https://github.com/marcschier/opc-classic/\.github/workflows/release\.yml@.*' \
          #     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          cosign sign --yes "ghcr.io/marcschier/opc-classic-managed@${env:DIGEST}"

      - name: Build and push opc-classic-c-server (optional)
        id: build-cserver
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_reference_images == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: interop/docker/opc-c-server/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.cserver_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/marcschier/opc-classic
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=Opc.Classic native C OPC DA reference server
            org.opencontainers.image.description=C-built OPC DA reference server for downstream interop testing.

      - name: Sign opc-classic-c-server (cosign keyless, optional)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_reference_images == 'true' }}
        env:
          DIGEST: ${{ steps.build-cserver.outputs.digest }}
        shell: pwsh
        run: cosign sign --yes "ghcr.io/marcschier/opc-classic-c-server@${env:DIGEST}"

      - name: Build and push opc-classic-c-client (optional)
        id: build-cclient
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_reference_images == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: interop/docker/opc-c-client/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.cclient_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/marcschier/opc-classic
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=Opc.Classic native C OPC DA reference client
            org.opencontainers.image.description=C-built headless OPC DA test client for downstream interop testing.

      - name: Sign opc-classic-c-client (cosign keyless, optional)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_reference_images == 'true' }}
        env:
          DIGEST: ${{ steps.build-cclient.outputs.digest }}
        shell: pwsh
        run: cosign sign --yes "ghcr.io/marcschier/opc-classic-c-client@${env:DIGEST}"

  docker-publish-linux:
    # Build and push the LINUX variant of opc-classic-managed to GHCR as a
    # multi-arch (linux/amd64 + linux/arm64) manifest. Ubuntu runner +
    # docker buildx + QEMU; ~10x cheaper than the Windows servercore
    # variant above, and the right choice for non-Windows-COM scenarios
    # (the managed listener speaks plain TCP RPC — no Windows DCOM required
    # at runtime).
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Compute Linux Docker tag list
        id: tags
        shell: bash
        run: |
          VERSION='${{ needs.release.outputs.version }}'
          STABLE='${{ needs.release.outputs.is_stable }}'
          TAGS="ghcr.io/marcschier/opc-classic-managed-linux:${VERSION}"
          if [ "$STABLE" = "true" ]; then
            TAGS="${TAGS},ghcr.io/marcschier/opc-classic-managed-linux:latest"
          fi
          echo "linux_tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push opc-classic-managed-linux (multi-arch)
        id: build-managed-linux
        uses: docker/build-push-action@v6
        with:
          context: .
          file: interop/docker/opc-managed/Dockerfile.linux
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.linux_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/marcschier/opc-classic
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=Opc.Classic managed OPC DA server (Linux)
            org.opencontainers.image.description=Cross-platform .NET 10 managed OPC Classic DA server container (Linux variant).

      - name: Sign opc-classic-managed-linux (cosign keyless)
        env:
          DIGEST: ${{ steps.build-managed-linux.outputs.digest }}
        run: |
          # See docker-publish.Sign-opc-classic-managed for the cosign verify
          # command shape (same workflow identity).
          cosign sign --yes "ghcr.io/marcschier/opc-classic-managed-linux@${DIGEST}"

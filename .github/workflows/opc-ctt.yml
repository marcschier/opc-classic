name: OPC CTT conformance

on:
  workflow_dispatch:
  schedule:
    # Weekly on Sunday at 03:00 UTC.
    - cron: '0 3 * * 0'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  # CttServer ProgID/CLSID — must match samples/Opc.Classic.Samples.CttServer/Program.cs.
  CTT_PROGID: Opc.Classic.DaSample.1
  CTT_CLSID: '{8F7C1B14-9A6E-4E4D-B5E6-5B7DCC1F2B3A}'

jobs:
  opc-ctt-conformance:
    runs-on: windows-2022
    if: github.repository == 'marcschier/opc-classic'  # don't run on forks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # ----- Install the OPC Compliance Test Tool from vendored MSIs -----
      # Install order matters: the Common Modules MSI provides OpcCtt.exe and
      # the OPCEnum service that the plugin MSIs depend on; plugins must come
      # after. Exit code 0 = success; 3010 = reboot pending (harmless in CI).
      - name: Install CTT Common Modules
        shell: pwsh
        run: |
          $msi = Resolve-Path 'external/private/ctt/OPC CTT Common Modules 2.0.15.msi'
          $log = "$env:RUNNER_TEMP\msi-common-modules.log"
          Write-Host "Installing $msi (log: $log)"
          # /l*v emits a verbose install log; we upload it as an artifact so a
          # silent install failure (e.g. blocked feature, missing prerequisite)
          # is diagnosable post-run. INSTALLLEVEL=1000 selects all features so
          # we don't silently end up with the install excluding OpcCtt.exe.
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart', '/l*v', "`"$log`"", 'INSTALLLEVEL=1000' -Wait -PassThru -NoNewWindow
          Write-Host "msiexec exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            if (Test-Path $log) { Get-Content $log -Tail 80 | ForEach-Object { Write-Host "[log] $_" } }
            throw "msiexec failed with exit code $($p.ExitCode)"
          }
          # Sanity: show where the MSI actually deployed files (recursive
          # search for OpcCtt.exe + the installed OPC Foundation tree shape).
          Write-Host '--- C:\Program Files\OPC Foundation\ ---'
          Get-ChildItem 'C:\Program Files\OPC Foundation\' -Recurse -Depth 4 -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table -AutoSize -Wrap
          Write-Host '--- C:\Program Files (x86)\OPC Foundation\ ---'
          Get-ChildItem 'C:\Program Files (x86)\OPC Foundation\' -Recurse -Depth 4 -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table -AutoSize -Wrap

      - name: Install CTT Data Access 2.05a Plugin
        shell: pwsh
        run: |
          $msi = Resolve-Path 'external/private/ctt/OPC CTT DataAccess2 Modules 2.0.22.msi'
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "msiexec failed with exit code $($p.ExitCode)"
          }

      - name: Install CTT Data Access 3.0 Plugin
        shell: pwsh
        run: |
          $msi = Resolve-Path 'external/private/ctt/OPC CTT DataAccess3 Modules 1.0.18.msi'
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "msiexec failed with exit code $($p.ExitCode)"
          }

      - name: Install CTT Alarms & Events Plugin
        shell: pwsh
        run: |
          $msi = Resolve-Path 'external/private/ctt/OPC CTT AlarmEvents Modules 1.0.14.msi'
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "msiexec failed with exit code $($p.ExitCode)"
          }

      - name: Install CTT Historical Data Plugin
        shell: pwsh
        run: |
          $msi = Resolve-Path 'external/private/ctt/OPC CTT Historical DA Modules 1.0.8.msi'
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "msiexec failed with exit code $($p.ExitCode)"
          }

      - name: Install CTT XML-DA Plugin
        shell: pwsh
        run: |
          $msi = Resolve-Path 'external/private/ctt/OPC CTT XMLDA Modules 1.0.8.msi'
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "msiexec failed with exit code $($p.ExitCode)"
          }

      - name: Ensure OPCEnum service is running
        shell: pwsh
        run: |
          # OPCEnum is the OPC Foundation server-enumeration service installed by
          # the Common Modules MSI. CTT browses it to find OPC servers on the host.
          $svc = Get-Service -Name OpcEnum -ErrorAction SilentlyContinue
          if ($null -eq $svc) {
            Write-Host "::warning::OpcEnum service not installed; the CTT may still find servers via direct CLSID lookup"
          } elseif ($svc.Status -ne 'Running') {
            Start-Service OpcEnum
            Write-Host "Started OpcEnum service"
          } else {
            Write-Host "OpcEnum service already running"
          }

      # ----- Build + register the managed sample DA server -----
      - name: Publish Opc.Classic.Samples.CttServer (Release)
        run: dotnet publish samples/Opc.Classic.Samples.CttServer -c Release -v:minimal

      - name: Register Opc.Classic.DaSample.1 (HKLM, both registry views)
        shell: pwsh
        run: |
          $exe = Resolve-Path 'samples/Opc.Classic.Samples.CttServer/bin/Release/net10.0/publish/Opc.Classic.Samples.CttServer.exe'
          & $exe --register
          if ($LASTEXITCODE -ne 0) {
            throw "--register failed with exit code $LASTEXITCODE"
          }

          Write-Host '--- HKLM:\Software\Classes\CLSID\{8F7C1B14-...} ---'
          reg query "HKLM\Software\Classes\CLSID\$($env:CTT_CLSID)" /s

      # ----- Run the CTT (continue-on-error: this remains a diagnostic smoke while
      #       the headless CLI and remaining conformance gaps are verified. See
      #       docs/ctt/CI_DESIGN.md). -----
      - name: Locate OPC CTT (OPCDACT.exe / per-spec compliance EXEs)
        id: locate-ctt
        shell: pwsh
        run: |
          # CTT v2.0.15 installs under "Compliance Test 2.00\" (not "OPC
          # Compliance Test Tool\") and the shell EXE is OPCDACT.exe (not
          # OpcCtt.exe). Per-spec compliance EXEs under sibling subdirs:
          #   Common\OPCDACT.exe          - shell, "OPC Compliance Test Tool"
          #                                  per its FileVersion-info
          #   Common\OPCTData.exe         - test-database editor
          #   DataAccess2\OPCComp2.exe    - DA 2.05a compliance
          #   DataAccess3\OPCComp3.exe    - DA 3.0 compliance
          #   AlarmEvents\OPCComplAE.exe  - AE 1.10 compliance
          #   HistoricalDA\ComplianceHDA.exe - HDA 1.00 compliance
          # All shipped EXEs are GUI applications -- no documented headless
          # CLI flags. The smoke step below remains a diagnostic launcher
          # (continue-on-error) that's primarily useful for confirming the
          # install + registration handshake; a true headless CTT pass
          # needs UI automation (AutoIt / pywinauto) or a future CTT
          # release with a CLI.
          $cttRoot = @(
            "$env:ProgramFiles\OPC Foundation\Compliance Test 2.00",
            "${env:ProgramFiles(x86)}\OPC Foundation\Compliance Test 2.00"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cttRoot) {
            Write-Host "::warning::CTT install root not found under OPC Foundation\Compliance Test 2.00\"
            foreach ($r in @("$env:ProgramFiles\OPC Foundation", "${env:ProgramFiles(x86)}\OPC Foundation")) {
              if (Test-Path $r) {
                Write-Host "--- $r tree ---"
                Get-ChildItem $r -Recurse -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table -AutoSize -Wrap
              } else {
                Write-Host "    $r does NOT exist"
              }
            }
            echo "found=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $shell = Join-Path $cttRoot 'Common\OPCDACT.exe'
          if (-not (Test-Path $shell)) {
            Write-Host "::warning::OPCDACT.exe not found at $shell; listing the CTT root for triage"
            Get-ChildItem $cttRoot -Recurse -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table -AutoSize -Wrap
            echo "found=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          echo "found=$shell" >> $env:GITHUB_OUTPUT
          Write-Host "CTT shell located at: $shell"
          (Get-Item $shell).VersionInfo | Format-List FileDescription, ProductName, FileVersion, CompanyName

      - name: Run OPC CTT against managed server (smoke; non-blocking)
        if: steps.locate-ctt.outputs.found != ''
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 5
        run: |
          $cttExe = '${{ steps.locate-ctt.outputs.found }}'
          $output = "$env:RUNNER_TEMP\ctt-results.xml"
          Write-Host "Smoke-launching CTT shell against $($env:CTT_PROGID)"
          # CTT v2.0.15 has no documented headless CLI; OPCDACT.exe is a
          # WinForms GUI app that hangs on /? and doesn't honor /AUTO.
          # Launch it briefly to confirm it starts cleanly then kill --
          # this proves the install + DCOM registration handshake works
          # without trying to drive the GUI from CI. A real conformance
          # pass needs operator UI interaction or a future CTT CLI.
          $p = Start-Process $cttExe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            Write-Host "CTT shell exited early with code $($p.ExitCode)"
          } else {
            Write-Host "CTT shell launched (PID $($p.Id)); stopping to keep CI bounded"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      # ----- Always unregister + collect logs, even on failure -----
      - name: Unregister managed server (always)
        if: always()
        shell: pwsh
        run: |
          $exe = 'samples/Opc.Classic.Samples.CttServer/bin/Release/net10.0/publish/Opc.Classic.Samples.CttServer.exe'
          if (Test-Path $exe) {
            & $exe --unregister
          }

      - name: Upload CTT artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opc-ctt-results
          path: |
            ${{ runner.temp }}/ctt-results.xml
            ${{ runner.temp }}/msi-common-modules.log
          if-no-files-found: warn

name: OPC CTT conformance

on:
  workflow_dispatch:
  schedule:
    # Weekly on Sunday at 03:00 UTC.
    - cron: '0 3 * * 0'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  # CttServer ProgID/CLSID — must match samples/Opc.Classic.Samples.CttServer/Program.cs.
  CTT_PROGID: Opc.Classic.DaSample.1
  CTT_CLSID: '{8F7C1B14-9A6E-4E4D-B5E6-5B7DCC1F2B3A}'

jobs:
  opc-ctt-conformance:
    runs-on: windows-2022
    if: github.repository == 'marcschier/opc-classic'  # don't run on forks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # ----- Install the OPC Compliance Test Tool from vendored MSIs -----
      # Install order matters: the Common Modules MSI provides OpcCtt.exe and
      # the OPCEnum service that the plugin MSIs depend on; plugins must come
      # after. Exit code 0 = success; 3010 = reboot pending (harmless in CI).
      - name: Install CTT Common Modules
        shell: pwsh
        run: |
          $msi = Resolve-Path 'ext/private/ctt/OPC CTT Common Modules 2.0.15.msi'
          Write-Host "Installing $msi"
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "msiexec failed with exit code $($p.ExitCode)"
          }

      - name: Install CTT Data Access 2.05a Plugin
        shell: pwsh
        run: |
          $msi = Resolve-Path 'ext/private/ctt/OPC CTT DataAccess2 Modules 2.0.22.msi'
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "msiexec failed with exit code $($p.ExitCode)"
          }

      - name: Install CTT Data Access 3.0 Plugin
        shell: pwsh
        run: |
          $msi = Resolve-Path 'ext/private/ctt/OPC CTT DataAccess3 Modules 1.0.18.msi'
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "msiexec failed with exit code $($p.ExitCode)"
          }

      - name: Install CTT Alarms & Events Plugin
        shell: pwsh
        run: |
          $msi = Resolve-Path 'ext/private/ctt/OPC CTT AlarmEvents Modules 1.0.14.msi'
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "msiexec failed with exit code $($p.ExitCode)"
          }

      - name: Install CTT Historical Data Plugin
        shell: pwsh
        run: |
          $msi = Resolve-Path 'ext/private/ctt/OPC CTT Historical DA Modules 1.0.8.msi'
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "msiexec failed with exit code $($p.ExitCode)"
          }

      - name: Install CTT XML-DA Plugin
        shell: pwsh
        run: |
          $msi = Resolve-Path 'ext/private/ctt/OPC CTT XMLDA Modules 1.0.8.msi'
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "msiexec failed with exit code $($p.ExitCode)"
          }

      - name: Ensure OPCEnum service is running
        shell: pwsh
        run: |
          # OPCEnum is the OPC Foundation server-enumeration service installed by
          # the Common Modules MSI. CTT browses it to find OPC servers on the host.
          $svc = Get-Service -Name OpcEnum -ErrorAction SilentlyContinue
          if ($null -eq $svc) {
            Write-Host "::warning::OpcEnum service not installed; the CTT may still find servers via direct CLSID lookup"
          } elseif ($svc.Status -ne 'Running') {
            Start-Service OpcEnum
            Write-Host "Started OpcEnum service"
          } else {
            Write-Host "OpcEnum service already running"
          }

      # ----- Build + register the managed sample DA server -----
      - name: Publish Opc.Classic.Samples.CttServer (Release)
        run: dotnet publish samples/Opc.Classic.Samples.CttServer -c Release -v:minimal

      - name: Register Opc.Classic.DaSample.1 (HKLM, both registry views)
        shell: pwsh
        run: |
          $exe = Resolve-Path 'samples/Opc.Classic.Samples.CttServer/bin/Release/net10.0/publish/Opc.Classic.Samples.CttServer.exe'
          & $exe --register
          if ($LASTEXITCODE -ne 0) {
            throw "--register failed with exit code $LASTEXITCODE"
          }

          Write-Host '--- HKLM:\Software\Classes\CLSID\{8F7C1B14-...} ---'
          reg query "HKLM\Software\Classes\CLSID\$($env:CTT_CLSID)" /s

      # ----- Run the CTT (continue-on-error: this remains a diagnostic smoke while
      #       the headless CLI and remaining conformance gaps are verified. See
      #       docs/ctt/CI_DESIGN.md). -----
      - name: Locate OpcCtt.exe and dump help
        id: locate-ctt
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\OPC Foundation\OPC Compliance Test Tool\OpcCtt.exe",
            "${env:ProgramFiles(x86)}\OPC Foundation\OPC Compliance Test Tool\OpcCtt.exe",
            "$env:ProgramFiles\OPC Foundation\OPC Foundation Compliance Test Tool\OpcCtt.exe",
            "${env:ProgramFiles(x86)}\OPC Foundation\OPC Foundation Compliance Test Tool\OpcCtt.exe"
          )
          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) { $found = $c; break }
          }
          if (-not $found) {
            Write-Host "::warning::OpcCtt.exe was not found in any expected install path"
            Get-ChildItem "$env:ProgramFiles\OPC Foundation" -Recurse -Filter 'OpcCtt.exe' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Found candidate: $($_.FullName)" }
            Get-ChildItem "${env:ProgramFiles(x86)}\OPC Foundation" -Recurse -Filter 'OpcCtt.exe' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Found candidate: $($_.FullName)" }
            echo "found=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          echo "found=$found" >> $env:GITHUB_OUTPUT
          Write-Host "OpcCtt.exe located at: $found"

          # Dump help output as a diagnostic; the actual headless CLI flags are
          # TBD and will be confirmed on the first real CI run.
          & $found /? 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\opcctt-help.txt"

      - name: Run OPC CTT against managed server (smoke; non-blocking)
        if: steps.locate-ctt.outputs.found != ''
        continue-on-error: true
        shell: pwsh
        run: |
          $cttExe = '${{ steps.locate-ctt.outputs.found }}'
          $output = "$env:RUNNER_TEMP\ctt-results.xml"
          Write-Host "Running CTT smoke against $($env:CTT_PROGID)"
          # TODO: the actual CTT v2.0.15 headless CLI is unverified. /AUTO /Output:
          # /ServerProgId: is speculative — replace with the canonical syntax once
          # confirmed against the help output from the previous step.
          & $cttExe /AUTO "/Output:$output" "/ServerProgId:$($env:CTT_PROGID)"
          Write-Host "CTT exit code: $LASTEXITCODE"

      # ----- Always unregister + collect logs, even on failure -----
      - name: Unregister managed server (always)
        if: always()
        shell: pwsh
        run: |
          $exe = 'samples/Opc.Classic.Samples.CttServer/bin/Release/net10.0/publish/Opc.Classic.Samples.CttServer.exe'
          if (Test-Path $exe) {
            & $exe --unregister
          }

      - name: Upload CTT artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opc-ctt-results
          path: |
            ${{ runner.temp }}/ctt-results.xml
            ${{ runner.temp }}/opcctt-help.txt
          if-no-files-found: warn

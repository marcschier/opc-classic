name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build-${{ matrix.os }}-${{ matrix.configuration }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        if: hashFiles('OpcClassic.slnx') != ''
        run: dotnet restore OpcClassic.slnx

      - name: Build
        if: hashFiles('OpcClassic.slnx') != ''
        run: dotnet build OpcClassic.slnx --configuration ${{ matrix.configuration }} --no-restore

      - name: Test with coverage
        if: hashFiles('OpcClassic.slnx') != ''
        shell: pwsh
        run: |
          $coverageRoot = Join-Path $PWD "coverage-results"
          if (Test-Path $coverageRoot) {
            Remove-Item -Recurse -Force $coverageRoot
          }
          New-Item -ItemType Directory -Path $coverageRoot -Force | Out-Null

          $failed = $false
          $projects = Get-ChildItem -Path "tests" -Filter "*.csproj" -Recurse | Sort-Object FullName
          foreach ($project in $projects) {
            $name = [IO.Path]::GetFileNameWithoutExtension($project.Name)
            $projectResults = Join-Path $coverageRoot $name
            New-Item -ItemType Directory -Path $projectResults -Force | Out-Null

            Write-Host "Testing $name"
            dotnet test $project.FullName --configuration ${{ matrix.configuration }} --no-build --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory $projectResults --logger "trx;LogFileName=$name.trx"
            if ($LASTEXITCODE -ne 0) {
              $failed = $true
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Install ReportGenerator
        if: hashFiles('OpcClassic.slnx') != ''
        shell: pwsh
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          if ($LASTEXITCODE -ne 0) {
            dotnet tool update -g dotnet-reportgenerator-globaltool
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $toolPath = Join-Path (Join-Path $HOME ".dotnet") "tools"
          $toolPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate coverage report
        if: hashFiles('OpcClassic.slnx') != ''
        shell: pwsh
        run: |
          reportgenerator `
            -reports:./coverage-results/**/coverage.cobertura.xml `
            -targetdir:./coverage-report `
            -reporttypes:"Cobertura;TextSummary;MarkdownSummaryGithub" `
            -assemblyfilters:"+*;-OpcClassic.Dcom*;-SharpInterop*;-OpcClassic.Generators*;-*Tests*" `
            -classfilters:"+*;-*.Generated.*;-*Tests*" `
            -filefilters:"-**/obj/**;-**/bin/**;-**/*.g.cs"

      - name: Print coverage summary
        if: always() && hashFiles('coverage-report/Summary.txt') != ''
        shell: pwsh
        run: Get-Content ./coverage-report/Summary.txt

      - name: Append coverage to job summary
        if: always() && hashFiles('coverage-report/SummaryGithub.md') != ''
        shell: bash
        run: cat ./coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage gate (line >=70%, branch >=60%)
        if: hashFiles('OpcClassic.slnx') != ''
        shell: pwsh
        run: |
          [xml]$cov = Get-Content ./coverage-report/Cobertura.xml
          $line = [double]$cov.coverage.'line-rate' * 100
          $branch = [double]$cov.coverage.'branch-rate' * 100
          Write-Host "Line coverage: $($line.ToString('F2'))%"
          Write-Host "Branch coverage: $($branch.ToString('F2'))%"
          $lineMin = 70.0
          $branchMin = 60.0
          if ($line -lt $lineMin) { Write-Error "Line coverage $line% is below threshold $lineMin%"; exit 1 }
          if ($branch -lt $branchMin) { Write-Error "Branch coverage $branch% is below threshold $branchMin%"; exit 1 }
          Write-Host "Coverage gate PASSED"

      - name: Upload coverage
        if: always() && hashFiles('coverage-results/**/coverage.cobertura.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            coverage-results/**/coverage.cobertura.xml
            coverage-report/**

  format:
    name: dotnet-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: dotnet format --verify-no-changes
        if: hashFiles('OpcClassic.slnx') != ''
        run: dotnet format OpcClassic.slnx --verify-no-changes --severity error

  aot-canary:
    name: aot-canary-${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish NativeAOT canary
        if: hashFiles('samples/OpcClassic.AotCanary/*.csproj') != ''
        run: dotnet publish samples/OpcClassic.AotCanary --configuration Release -p:PublishAot=true -p:TreatWarningsAsErrors=true

  conformance-windows:
    name: conformance-windows
    needs: build
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build native COM sample servers (reference impl)
        if: hashFiles('OPC COM.sln') != ''
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86 || call "%ProgramFiles(x86)%\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvarsall.bat" x86
          msbuild "OPC COM.sln" /p:Configuration=Release /p:Platform=Win32 /v:minimal
      - name: Run conformance tests
        if: hashFiles('tests/**/*Conformance*.csproj') != ''
        run: dotnet test --filter "Category=Conformance" --configuration Release

  docfx-build:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install DocFX
        run: dotnet tool install -g docfx
      - name: Build site
        run: docfx docfx.json
      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: docfx-site
          path: _site
